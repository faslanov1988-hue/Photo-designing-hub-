<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design Studio Pro</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
    <!-- Header -->
    <header class="header">
        <h1>🎨 Design Studio Pro</h1>
        <div class="header-actions">
            <button class="btn btn-success" id="downloadBtn">⬇ Download PNG</button>
            <button class="btn btn-danger" id="clearAllBtn">🗑 Clear All</button>
        </div>
    </header>

    <!-- Toolbar -->
    <div class="toolbar">
        <div class="tool-group">
            <label>📷 Upload Image</label>
            <input type="file" id="uploadImage" accept="image/*" />
            <span class="file-label" onclick="document.getElementById('uploadImage').click()">Choose File</span>
            <span id="uploadStatus" style="font-size:12px;color:#888;"></span>
        </div>

        <div class="tool-group">
            <label>📝 Add Text</label>
            <input type="text" id="textInput" placeholder="Type your text..." value="Hello World!" />
            <input type="color" id="textColor" value="#ffffff" />
            <input type="range" id="textSize" min="10" max="100" value="40" />
            <span id="textSizeValue">40px</span>
            <button class="btn btn-primary" id="addTextBtn">➕ Add Text</button>
        </div>

        <div class="tool-group">
            <label>🎨 Background Templates</label>
            <div class="template-list" id="templateList">
                <!-- Templates will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Main Area -->
    <div class="main-area">
        <div class="canvas-wrapper">
            <canvas id="canvas" width="900" height="600"></canvas>
            <div class="canvas-hint">Click on canvas to select elements</div>
        </div>

        <div class="sidebar">
            <div class="sidebar-section">
                <h3>📋 Layers</h3>
                <div id="layersList" class="layers-list">
                    <p style="color:#888;font-size:12px;">No layers yet</p>
                </div>
            </div>

            <div class="sidebar-section">
                <h3>⚙ Selected Element</h3>
                <div id="elementControls">
                    <p style="color:#888;font-size:12px;">Click on an element to edit</p>
                </div>
            </div>

            <div class="sidebar-section">
                <h3>🖼 Uploaded Images</h3>
                <div id="uploadedImages" class="uploaded-images">
                    <p style="color:#888;font-size:12px;">No images uploaded</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
